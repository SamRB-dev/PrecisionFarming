name: Refresh project Gantt
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "documentation/TASK_LOG.md"
      - "documentation/project_management/milestones.csv"
      - "documentation/project_management/generate_gantt.py"
      - ".github/workflows/refresh-gantt.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Gantt
        run: python documentation/project_management/generate_gantt.py
      - name: Commit and push updated Gantt (retry on concurrent updates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/project_management/GANTT.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh project Gantt"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push race detected; rebasing onto latest origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "Push failed after retries"
          exit 1
