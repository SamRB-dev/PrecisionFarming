name: Refresh project Gantt
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "gantt_tasks.csv"
      - "generate_gantt.py"
      - ".github/workflows/refresh-gantt.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python generate_gantt.py
      - name: Commit updated Gantt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GANTT.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: refresh project Gantt"; git push; fi
